spring:
  application:
    name: bff-ikon-brasil
  profiles:
    active: dev

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: BFF da plataforma IKO Nakamura Brasil
    version: 0.0.1-SNAPSHOT

ikon:
  auth:
    jwt-secret: ${JWT_SECRET:ikon-auth-dev-secret-change-me-ikon-auth-dev-secret-change-me}
  servicos:
    ms-auth-url: ${MS_AUTH_URL:http://localhost:8081}
    ms-cadastro-filiados-url: ${MS_CADASTRO_FILIADOS_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,https://gestao-hml.ikon-br.com.br,https://gestao.ikon-br.com.br}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
